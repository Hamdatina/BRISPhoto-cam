name: Build BRIS Photo Helper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Ekstrak proyek
        run: |
          unzip -q BRISPhotoHelper-Android.zip
          ls -la
          ls -la BRISPhotoHelper

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: BRISPhotoHelper
        run: gradle --no-daemon assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: BRISPhotoHelper-APK
          path: BRISPhotoHelper/app/build/outputs/apk/debug/app-debug.apk
